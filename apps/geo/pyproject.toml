[project]
name = "geo"
version = "0.0.0"
description = "Servicio geoespacial de Ehécatl"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "rasterio>=1.4.4",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
