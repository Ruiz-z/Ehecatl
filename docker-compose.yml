services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehecatl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ehecatl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ehecatl}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-ehecatl}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      GEO_URL: http://geo:8000
      NASA_CACHE_TTL_HOURS: ${NASA_CACHE_TTL_HOURS:-24}
      READINGS_MAX_AGE_HOURS: ${READINGS_MAX_AGE_HOURS:-168}
      READINGS_RETENTION_DAYS: ${READINGS_RETENTION_DAYS:-90}
      GEO_TIMEOUT_MS: ${GEO_TIMEOUT_MS:-130000}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Define SEED_DEMO_PASSWORD en .env}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      geo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m

  geo:
    build:
      context: apps/geo
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
